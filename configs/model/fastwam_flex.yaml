_target_: fastwam.runtime.create_fastwam_flex
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
modality_profile: false
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

# HBridge uses stream-local attention at the bottom and top of the trunk and
# mixed cross-modal attention in the middle layers.
hbridge_enabled: true
hbridge_bottom_ratio: 0.25
hbridge_top_ratio: 0.25

# All current visual anchors are present during this fixed full-modality run.
present_probabilities:
  rgb: 1.0
  dino: 1.0
  pointmap: 1.0

# All future visual streams are jointly read out by action and each other.
output_probabilities:
  rgb: 1.0
  dino: 1.0
  pointmap: 1.0

# Controls whether m_in/m_out are sampled independently per example or shared
# by the local batch. fixed_all_modalities disables routing randomness.
routing_sampling_scope: fixed_all_modalities

# An absent input can remain an output target for cross-modal forcing.
cross_modal_predict:
  rgb: true
  dino: true
  pointmap: true

# By default evaluation exposes all visual anchors and predicts every stream.
# These switches can be overridden for action-only or selected-visual inference.
inference_present_modalities:
  rgb: true
  dino: true
  pointmap: true
inference_output_modalities:
  rgb: true
  dino: true
  pointmap: true

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: group_diagonal

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

dino_model_name: vit_base_patch16_dinov3.lvd1689m
dino_pretrained_path: checkpoints/models/dinov3/vit_base_patch16_dinov3.lvd1689m/model.safetensors
dino_dim: 3072
dino_output_grid_size: 6
dino_pred_x0: true

video_scheduler: &visual_scheduler
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

dino_scheduler: *visual_scheduler
pointmap_scheduler: *visual_scheduler

action_scheduler:
  train_shift: 1.0
  infer_shift: 1.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0
  lambda_dino: 1.0
  lambda_pointmap: 1.0
