# @package _global_

defaults:
  - override /data: b1k_2026_direct_video_flex
  - override /model: fastwam_flex
  - _self_

# FastWAM Flex with the FastWAM pretrain mechanisms folded in:
#   * 10% proprioception (state) token dropout
#   * shared training timestep across RGB / DINO / pointmap / action
#   * action schedule shift aligned to the visual streams (1.0 -> 5.0)
#
# The code mechanisms add no parameters, so existing Flex checkpoints remain
# structurally loadable. This training contract starts from
# scratch (resume/flex_warmstart/legacy_warmstart are all null) for a clean A/B.
# The shift=5 values are run-specific and must not replace the base Flex
# config's action shift=1 defaults; scheduler shifts are checkpoint-contracted.
#
# Sizing: one full-data epoch is ~35.16M samples. At 256 GPUs with local batch
# 32 the global batch is 8192, giving 4,292 optimizer steps per epoch.
batch_size: 32
num_workers: 8
prefetch_factor: 1
persistent_workers: true

model:
  mot_checkpoint_mixed_attn: true

  # Zero the state vector on 10% of samples while keeping the token and its
  # attention slot, so the context length stays constant.
  proprio_token_dropout_prob: 0.1

  # `shared_train_timestep` is read from the video scheduler and broadcasts the
  # RGB timestep to every other stream during training.
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
    shared_train_timestep: true

  # Declared explicitly rather than via the YAML anchor in the model config, so
  # the shared-timestep switch cannot leak between streams.
  dino_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000

  pointmap_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000

  # Aligned to the visual streams (FastWAM pretrain setting). Flex previously
  # used 1.0, which made the action timestep diverge from the visual streams at
  # inference even though all streams advance on the same step index.
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000

lr_scheduler_type: cosine
learning_rate: 2.0e-4
min_learning_rate: 1.0e-6
lr_warmup_steps: 1288
num_epochs: 30
max_steps: 128760
log_every: 10
save_every: 1000
checkpoint_retention:
  max_to_keep: 2
  keep_every_n_steps: null
  keep_final: true
  # One full-data epoch at 256 GPUs with local batch 32.
  permanent_weights_every_n_steps: 4292
eval_every: 0

fixed_validation:
  enabled: false
  steps: []
  every_steps: 0
  tasks: 100
  anchors_per_task: 10
  anchor_stride: 6
  seed: 42
  max_duration_seconds: 900

qualitative_validation:
  enabled: false
  steps: []
  every_steps: 0
  num_windows: 128
  expected_tasks: 100
  videos: 8
  inference_steps: 10
  seed: 42
  fps: 8
  max_duration_seconds: 900

gradient_accumulation_steps: 1
mixed_precision: bf16
max_grad_norm: 1.0
weight_decay: 1.0e-2
resume: null
legacy_warmstart: null
flex_warmstart: null

wandb:
  name: b1k_2026_fastwam_flex_statedrop10_sharedt_ashift5_256gpu

tensorboard:
  enabled: true
