# @package _global_

# LEGACY: early JPEG-based 352x224 experiment/profile configuration.
# Do not use this task config for formal training.

defaults:
  - override /data: b1k_2026_legacy_jpeg224
  - override /model: fastwam
  - _self_

# Conservative profiling default. The 8-GPU benchmark selects the final value.
batch_size: 1
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  loss:
    lambda_video: 1.0
    lambda_action: 1.0

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 1
mixed_precision: bf16
max_grad_norm: 1.0
weight_decay: 1.0e-2
resume: null
