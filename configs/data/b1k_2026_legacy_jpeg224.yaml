# LEGACY: preprocessed 224x224 JPEG input used by early B1K experiments only.
# Do not use this data config for formal training; use b1k_2026_direct_video.

train:
  _target_: fastwam.datasets.b1k.dataset.B1KRobotVideoDataset
  dataset_root: ./data/behavior-1k/2026-challenge-demos-224-rgb-jpeg
  split: train
  shape_meta:
    images:
      - key: rgb.head
        raw_shape: [3, 224, 224]
        shape: [3, 224, 224]
      - key: rgb.left_wrist
        raw_shape: [3, 224, 224]
        shape: [3, 224, 224]
      - key: rgb.right_wrist
        raw_shape: [3, 224, 224]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 23
        shape: 23
    state:
      - key: default
        raw_shape: 61
        shape: 23
  num_frames: 33
  global_sample_stride: 2
  window_start_stride: 6
  action_video_freq_ratio: 4
  video_size: [352, 224]
  camera_key: null
  skip_padding_as_possible: false
  processor:
    _target_: fastwam.datasets.b1k.processor.B1KFastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: 33
    num_image_steps: 9
    num_output_cameras: 3
    action_output_dim: 23
    proprio_output_dim: 23
    action_state_transforms:
      - _target_: fastwam.datasets.b1k.contract.B1KActionStateTransform
    use_stepwise_action_norm: false
    norm_default_mode: z-score
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  pretrained_norm_stats: artifacts/b1k_2026/norm_stats.json
  text_embedding_cache_dir: artifacts/b1k_2026/text_embeds
  context_len: 128
  text_cache_size: 128

val:
  _target_: fastwam.datasets.b1k.dataset.B1KRobotVideoDataset
  dataset_root: ${data.train.dataset_root}
  split: validation
  shape_meta: ${data.train.shape_meta}
  num_frames: 33
  global_sample_stride: 2
  window_start_stride: 6
  action_video_freq_ratio: 4
  video_size: [352, 224]
  camera_key: null
  skip_padding_as_possible: false
  processor:
    _target_: fastwam.datasets.b1k.processor.B1KFastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: 33
    num_image_steps: 9
    num_output_cameras: 3
    action_output_dim: 23
    proprio_output_dim: 23
    action_state_transforms:
      - _target_: fastwam.datasets.b1k.contract.B1KActionStateTransform
    use_stepwise_action_norm: false
    norm_default_mode: z-score
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  pretrained_norm_stats: ${data.train.pretrained_norm_stats}
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  context_len: 128
  text_cache_size: 128
